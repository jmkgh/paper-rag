[project]
name = "paper-rag"
version = "0.1.0"
description = "Small local RAG assistant for scientific papers, with a focus on transparent evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "litellm>=1.110.2",
    "ollama>=0.6.3",
    "pymupdf>=2.1",
    "pyyaml>=6.0.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Harmless warnings from pymupdf's SWIG bindings on Python 3.11+.
filterwarnings = ["ignore:builtin type (SwigPy|swigvarlink).*:DeprecationWarning"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
